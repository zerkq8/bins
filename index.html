<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>مرصد المتداولين — باينس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F1A; --card:#111A2B; --card-2:#0E1626; --line:#1D2A40;
    --text:#E3EBF5; --muted:#8296AF; --dim:#5C6E86;
    --jade:#2FBF9A; --rust:#E8664A; --amber:#D9A441;
    --r:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; font-size:15px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Tajawal",sans-serif; margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px}
  a{color:var(--amber)}

  header{
    background:linear-gradient(180deg,#0E1727,#0A0F1A);
    border-bottom:1px solid var(--line); padding:18px 0 20px;
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .brand h1{font-size:21px; font-weight:800}
  .brand span{color:var(--dim); font-size:12.5px}
  .searchbar{display:flex; gap:8px; margin-top:13px}
  .searchbar input{
    flex:1; background:#0C1524; border:1px solid var(--line); color:var(--text);
    padding:11px 14px; border-radius:var(--r); font:inherit; font-size:15px;
  }
  .searchbar input::placeholder{color:var(--dim)}
  .searchbar input:focus{outline:none; border-color:var(--amber)}
  .searchbar button{
    background:var(--amber); color:#15100A; border:0; padding:0 22px;
    border-radius:var(--r); font:inherit; font-weight:700; cursor:pointer;
  }
  .searchbar button:active{filter:brightness(.9)}

  .grid{display:grid; grid-template-columns:330px 1fr; gap:16px; padding:16px 0 60px; align-items:start}
  @media(max-width:880px){ .grid{grid-template-columns:1fr} }

  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
  .panel-head{display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line)}
  .panel-head h2{font-size:14.5px; font-weight:700}
  .live{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--jade)}
  @media (prefers-reduced-motion:no-preference){ .dot{animation:p 2.4s ease-in-out infinite} }
  @keyframes p{0%,100%{opacity:1}50%{opacity:.2}}

  .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; direction:ltr}
  .up{color:var(--jade)} .down{color:var(--rust)}

  .trader-row{
    display:grid; grid-template-columns:24px 1fr auto; gap:9px; align-items:center;
    padding:11px 13px; border-bottom:1px solid #16223444; cursor:pointer;
    background:none; width:100%; text-align:right; font:inherit; color:inherit;
  }
  .trader-row:last-child{border-bottom:0}
  .trader-row:hover{background:#16223A}
  .trader-row.active{background:#16223A; box-shadow:inset 3px 0 0 var(--amber)}
  .rank{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--amber)}
  .tname{font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .tsub{font-size:11px; color:var(--dim)}
  .troi{font-family:"IBM Plex Mono",monospace; font-weight:600; font-size:13.5px; direction:ltr}

  .hero{padding:15px 17px; border-bottom:1px solid var(--line)}
  .hero h2{font-size:19px; font-weight:800}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px}
  .tag{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:20px; padding:2px 9px}
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line)}
  @media(max-width:620px){ .stats{grid-template-columns:repeat(2,1fr)} }
  .stat{background:var(--card-2); padding:12px 14px}
  .stat b{display:block; font-family:"IBM Plex Mono",monospace; font-size:16px; font-weight:600; direction:ltr}
  .stat span{font-size:11px; color:var(--dim)}

  .sec-title{display:flex; align-items:baseline; gap:8px; padding:15px 16px 6px; font-family:"Tajawal"; font-weight:700; font-size:14px}
  .sec-title em{font-style:normal; font-size:11px; color:var(--dim); font-weight:500}

  .trade{padding:12px 16px; border-top:1px solid #16223455}
  .trade-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .sym{font-weight:700; font-size:14px; direction:ltr; font-family:"IBM Plex Mono",monospace}
  .chip{font-size:10.5px; padding:1px 7px; border-radius:4px; font-weight:600; border:1px solid currentColor}
  .chip.long{color:var(--jade)} .chip.short{color:var(--rust)} .chip.lev{color:var(--dim)}
  .trade-roi{margin-inline-start:auto; font-family:"IBM Plex Mono",monospace; font-weight:600; direction:ltr; font-size:14px}
  .trade-pnl{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--muted); direction:ltr; margin-top:3px}

  .lc-bar{height:5px; background:#16223A; border-radius:3px; position:relative; overflow:hidden; margin-top:9px}
  .lc-fill{position:absolute; inset-inline-start:0; top:0; bottom:0; border-radius:3px}
  .lc-fill.up{background:var(--jade)} .lc-fill.down{background:var(--rust)}
  .lc-times{display:flex; justify-content:space-between; margin-top:5px; font-size:11px; color:var(--dim); font-family:"IBM Plex Mono",monospace; direction:ltr}
  .lc-times .dur{color:var(--muted)}

  .empty{padding:24px 18px; color:var(--muted); font-size:14px}
  .note{margin:12px 16px 0; padding:10px 13px; border-radius:8px; background:#16223A; color:var(--muted); font-size:12.5px}
  .error{margin:14px; padding:12px 14px; border-radius:8px; background:#2A1512; border:1px solid #4A2119; color:#F0A997; font-size:13.5px}
  .skeleton{height:13px; background:#16223A; border-radius:4px; margin:11px 16px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">
      <h1>مرصد المتداولين</h1>
      <span>أفضل ١٠ متداولين على باينس + بحث بالاسم</span>
    </div>
    <div class="searchbar">
      <input id="q" type="search" placeholder="اكتب اسم المتداول…" autocomplete="off">
      <button id="go">بحث</button>
    </div>
  </div>
</header>

<div class="wrap"><div class="grid">
  <section class="panel">
    <div class="panel-head">
      <h2 id="listTitle">الأفضل خلال ٣٠ يوماً</h2>
      <span class="live"><i class="dot"></i><span id="listMeta">جارِ التحميل</span></span>
    </div>
    <div id="list"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section class="panel" id="detail">
    <div class="empty">اختر متداولاً من القائمة لعرض آخر ١٠ صفقات.</div>
  </section>
</div></div>

<script>
const $ = s => document.querySelector(s);
let currentId = null, timer = null;
const cacheRows = {};   // بيانات القائمة (فيها ROI ونسبة الربح)

async function getJSON(url){
  let res;
  try{ res = await fetch(url); }
  catch{ throw new Error('لا يوجد اتصال بالخادم.'); }
  const text = await res.text();
  let data;
  try{ data = JSON.parse(text); }
  catch{ throw new Error(res.status===404
    ? 'المسار '+url+' غير موجود. تأكد أن مجلد api منشور.'
    : 'الخادم رجّع صفحة بدل بيانات (كود '+res.status+').'); }
  if(!res.ok) throw new Error(data.error || ('خطأ '+res.status));
  return data;
}

const esc = s => String(s??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const has = v => v!==null && v!==undefined;
const fmtNum = (v,d=2) => !has(v)?'—':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const cls = v => !has(v)?'':(v>0?'up':v<0?'down':'');
const fmtPct = v => !has(v)?'—':(v>0?'+':v<0?'−':'')+fmtNum(Math.abs(v),2)+'%';
const fmtUsd = v => !has(v)?'—':(v>0?'+':v<0?'−':'')+'$'+fmtNum(Math.abs(v),2);
const fmtBig = v => !has(v)?'—':'$'+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});

function fmtTime(ms){
  if(!ms) return '—';
  const d = new Date(Number(ms)); if(isNaN(d)) return '—';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDur(a,b){
  if(!a||!b||b<a) return '';
  const m = Math.round((b-a)/60000);
  if(m<60) return m+' د';
  const h = Math.floor(m/60);
  if(h<24) return h+' س'+(m%60?' '+(m%60)+' د':'');
  return Math.floor(h/24)+' ي'+(h%24?' '+(h%24)+' س':'');
}

/* ---------- القائمة ---------- */
async function loadTop(){
  try{ renderList((await getJSON('/api/top')).traders, 'الأفضل خلال ٣٠ يوماً'); }
  catch(e){
    $('#list').innerHTML = `<div class="error">${esc(e.message)}</div>`;
    $('#listMeta').textContent = 'متوقف';
  }
}

async function search(){
  const q = $('#q').value.trim();
  if(!q) return loadTop();
  $('#list').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
  $('#listMeta').textContent = 'جارِ البحث';
  try{
    const d = await getJSON('/api/search?q='+encodeURIComponent(q));
    if(!d.traders.length){
      $('#listTitle').textContent = 'نتائج البحث';
      $('#listMeta').textContent = '٠';
      $('#list').innerHTML = '<div class="empty">لم يُعثر على هذا الاسم ضمن المتداولين الأعلى تصنيفاً. جرّب جزءاً من الاسم.</div>';
      return;
    }
    renderList(d.traders, 'نتائج البحث');
    selectTrader(d.traders[0].id);
  }catch(e){ $('#list').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
}

function renderList(traders, title){
  traders.forEach(t => cacheRows[t.id] = t);
  $('#listTitle').textContent = title;
  $('#listMeta').textContent = traders.length + ' متداول';
  $('#list').innerHTML = traders.map((t,i)=>`
    <button class="trader-row" data-id="${t.id}">
      <span class="rank">${String(i+1).padStart(2,'0')}</span>
      <span>
        <span class="tname">${esc(t.nickname)}</span>
        <span class="tsub">${has(t.winRate)?'رابحة '+fmtNum(t.winRate,0)+'%':''}${has(t.copiers)?' · '+t.copiers+' ناسخ':''}</span>
      </span>
      <span class="troi ${cls(t.roi)}">${fmtPct(t.roi)}</span>
    </button>`).join('');
  document.querySelectorAll('.trader-row').forEach(b => b.onclick = () => selectTrader(b.dataset.id));
}

/* ---------- التفاصيل ---------- */
async function selectTrader(id, quiet){
  currentId = id;
  document.querySelectorAll('.trader-row').forEach(b => b.classList.toggle('active', b.dataset.id===id));
  if(!quiet) $('#detail').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
  try{ renderDetail(await getJSON('/api/trader/'+encodeURIComponent(id)), id); }
  catch(e){ $('#detail').innerHTML = `<div class="error">${esc(e.message)}</div>`; }
  clearInterval(timer);
  timer = setInterval(()=> currentId && selectTrader(currentId, true), 45000);
}

function renderDetail(d, id){
  // دمج: القائمة فيها ROI ونسبة الربح، والتفاصيل فيها الأصول والناسخون
  const t = Object.assign({}, cacheRows[id] || {});
  for(const [k,v] of Object.entries(d.trader)) if(has(v)) t[k] = v;

  const maxDur = Math.max(1, ...d.closed.map(c => (c.closeTime&&c.openTime) ? c.closeTime-c.openTime : 0));

  const tradeHtml = d.closed.length ? d.closed.map(c=>{
    const dur = (c.closeTime&&c.openTime) ? c.closeTime-c.openTime : 0;
    const w = Math.max(4, Math.round(dur/maxDur*100));
    const isLong = c.side.includes('LONG') || c.side==='BUY';
    return `<div class="trade">
      <div class="trade-top">
        <span class="sym">${esc(c.symbol)}</span>
        <span class="chip ${isLong?'long':'short'}">${isLong?'شراء':'بيع'}</span>
        ${has(c.leverage)?`<span class="chip lev">×${c.leverage}</span>`:''}
        <span class="trade-roi ${cls(c.roi)}">${fmtPct(c.roi)}</span>
      </div>
      <div class="trade-pnl">${fmtUsd(c.pnl)} · دخول ${fmtNum(c.entryPrice,4)} → خروج ${fmtNum(c.exitPrice,4)}</div>
      <div class="lc-bar"><div class="lc-fill ${cls(c.roi)||'up'}" style="width:${w}%"></div></div>
      <div class="lc-times">
        <span>${fmtTime(c.openTime)}</span>
        <span class="dur">${fmtDur(c.openTime,c.closeTime)}</span>
        <span>${fmtTime(c.closeTime)}</span>
      </div>
    </div>`;
  }).join('') : '<div class="empty">هذا المتداول لا يعرض سجل صفقاته المغلقة.</div>';

  const openHtml = d.open.length ? d.open.map(o=>{
    const isLong = o.side.includes('LONG') || o.side==='BUY';
    return `<div class="trade">
      <div class="trade-top">
        <span class="sym">${esc(o.symbol)}</span>
        <span class="chip ${isLong?'long':'short'}">${isLong?'شراء':'بيع'}</span>
        ${has(o.leverage)?`<span class="chip lev">×${o.leverage}</span>`:''}
        <span class="trade-roi ${cls(o.roi)}">${fmtPct(o.roi)}</span>
      </div>
      <div class="trade-pnl">${fmtUsd(o.pnl)} غير محقق · دخول ${fmtNum(o.entryPrice,4)} · فُتح ${fmtTime(o.openTime)}</div>
    </div>`;
  }).join('')
    : (t.positionShow === false
        ? '<div class="note">هذا المتداول يُخفي مراكزه المفتوحة على باينس. سجل صفقاته المغلقة يبقى متاحاً بالأعلى.</div>'
        : '<div class="empty">لا توجد مراكز مفتوحة الآن.</div>');

  $('#detail').innerHTML = `
    <div class="hero">
      <h2>${esc(t.nickname)}</h2>
      <div class="tags">
        ${has(t.aum)?`<span class="tag">الأصول ${fmtBig(t.aum)}</span>`:''}
        ${has(t.mdd)?`<span class="tag">أقصى تراجع ${fmtNum(t.mdd,1)}%</span>`:''}
        ${has(t.copiers)?`<span class="tag">${t.copiers}${has(t.maxCopiers)?'/'+t.maxCopiers:''} ناسخ</span>`:''}
        ${has(d.totalClosed)?`<span class="tag">${d.totalClosed} صفقة إجمالاً</span>`:''}
      </div>
      <div class="live" style="margin-top:8px"><i class="dot"></i>آخر تحديث ${fmtTime(d.fetchedAt)} · كل ٤٥ ثانية</div>
    </div>
    <div class="stats">
      <div class="stat"><b class="${cls(t.roi)}">${fmtPct(t.roi)}</b><span>العائد ROI</span></div>
      <div class="stat"><b class="${cls(t.pnl)}">${fmtUsd(t.pnl)}</b><span>صافي ربح المتداول</span></div>
      <div class="stat"><b>${has(t.winRate)?fmtNum(t.winRate,1)+'%':'—'}</b><span>الصفقات الرابحة</span></div>
      <div class="stat"><b class="${cls(t.copierPnl)}">${fmtUsd(t.copierPnl)}</b><span>ربح الناسخين</span></div>
    </div>
    <div class="sec-title">آخر ١٠ صفقات مغلقة <em>الشريط = مدة الصفقة</em></div>
    ${tradeHtml}
    <div class="sec-title">مراكز مفتوحة الآن</div>
    ${openHtml}`;
}

$('#go').onclick = search;
$('#q').addEventListener('keydown', e => { if(e.key==='Enter') search(); });
$('#q').addEventListener('input', e => { if(!e.target.value.trim()) loadTop(); });
loadTop();
setInterval(()=>{ if(!$('#q').value.trim()) loadTop(); }, 120000);
</script>
</body>
</html>
